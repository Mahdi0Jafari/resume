# Coolify deployment for mahdijafari.ir.
# infrastructure/docker-compose.yml (own nginx, code bind-mount, host port 14805) stays untouched for local use.
# In Coolify: Docker Compose Location = /docker-compose.coolify.yml
# Domains are set in Coolify UI on the web service: https://mahdijafari.ir,https://www.mahdijafari.ir
# The API is routed by path (/api) on the same domains via the labels below (same as the old nginx).

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - "traefik.http.routers.mahdijafari-api-https.rule=(Host(`mahdijafari.ir`) || Host(`www.mahdijafari.ir`)) && PathPrefix(`/api/`)"
      - traefik.http.routers.mahdijafari-api-https.entrypoints=https
      - traefik.http.routers.mahdijafari-api-https.tls=true
      - traefik.http.routers.mahdijafari-api-https.tls.certresolver=letsencrypt
      - traefik.http.routers.mahdijafari-api-https.priority=100
      - traefik.http.routers.mahdijafari-api-https.service=mahdijafari-api
      - "traefik.http.routers.mahdijafari-api-http.rule=(Host(`mahdijafari.ir`) || Host(`www.mahdijafari.ir`)) && PathPrefix(`/api/`)"
      - traefik.http.routers.mahdijafari-api-http.entrypoints=http
      - traefik.http.routers.mahdijafari-api-http.middlewares=mahdijafari-redirect-https
      - traefik.http.routers.mahdijafari-api-http.priority=100
      - traefik.http.routers.mahdijafari-api-http.service=mahdijafari-api
      - traefik.http.middlewares.mahdijafari-redirect-https.redirectscheme.scheme=https
      - traefik.http.services.mahdijafari-api.loadbalancer.server.port=8000

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api

  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mahdi_node
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
