services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    pull_policy: if_not_present
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:

      - ../apps/api:/app
    env_file:
      - ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend



  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    pull_policy: if_not_present
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ../apps/api/.env # اگر فرانت‌ هم نیاز به متغیر داشت
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - INTERNAL_API_URL=http://api:8000
    networks:
      - frontend
      - backend

  postgres:
    image: ankane/pgvector:latest
    env_file:
      - ../apps/api/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mahdi_node
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    # پورت ۵۴۳۲ برای امنیت بسته ماند. فقط داخل شبکه داکر در دسترس است.



  nginx:
    image: nginx:alpine
    ports:
      - "14805:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: always
    networks:
      - frontend
      - backend

volumes:
  postgres_data:

networks:
  frontend:
  backend: